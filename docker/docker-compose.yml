version: "3.9"

name: ecommerce-infra

services:
  api-gateway:
    build:
      context: ../ApiGateway
      dockerfile: ApiGateway/Dockerfile
      additional_contexts:
        shared: ../Shared
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - auth
      - catalog
      - payments
      - orders
      - inventory
      - graphrag-api
      - notifications-api
      - pdf-worker
      - jaeger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Services__Auth: http://auth:8080
      Services__Catalog: http://catalog:8080
      Services__Payments: http://payments:8080
      Services__Orders: http://orders:8080
      Services__Inventory: http://inventory:8080
      Services__PdfWorker: http://pdf-worker:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${GATEWAY_PORT}:8080"

  catalog:
    build:
      context: ../Catalog
      dockerfile: Catalog/Dockerfile
      additional_contexts:
        shared: ../Shared
    container_name: catalog
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - redis
      - jaeger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: "Host=postgres;Port=5432;Database=catalog;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__VirtualHost: /
      Redis__ConnectionString: "redis:6379"
      Minio__Endpoint: minio:9000
      Minio__PublicEndpoint: http://minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${CATALOG_IMAGE_BUCKET:-products}
      # Private bucket for 3D models; created at startup. Served through short-lived presigned links.
      Minio__ModelBucket: ${CATALOG_MODEL_BUCKET:-product-models}
      # Host the browser uses to reach MinIO; presigned links are signed for this host.
      Minio__PresignEndpoint: http://localhost:${MINIO_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${CATALOG_PORT}:8080"      

  payments:
    build:
      context: ../Payments
      dockerfile: Payments/Dockerfile
      additional_contexts:
        shared: ../Shared
    container_name: payments
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - jaeger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: "Host=postgres;Port=5432;Database=payments;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__VirtualHost: /
      Redis__ConnectionString: "redis:6379"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${PAYMENTS_PORT}:8080"

  orders:
    build:
      context: ../Orders
      dockerfile: Orders/Dockerfile
      additional_contexts:
        shared: ../Shared
    container_name: orders
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - jaeger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: "Host=postgres;Port=5432;Database=orders;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__VirtualHost: /
      Redis__ConnectionString: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${ORDERS_PORT}:8080"

  inventory:
    build:
      context: ../Inventory
      dockerfile: Inventory/Dockerfile
      additional_contexts:
        shared: ../Shared
    container_name: inventory
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - jaeger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: "Host=postgres;Port=5432;Database=inventory;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__VirtualHost: /
      Redis__ConnectionString: "redis:6379"
      Inventory__ReservationTimeoutMinutes: ${INVENTORY_RESERVATION_TIMEOUT_MINUTES}
      Inventory__ExpiryJobIntervalSeconds: ${INVENTORY_EXPIRY_JOB_INTERVAL_SECONDS}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${INVENTORY_PORT}:8080"

  pdf-worker:
    build:
      context: ..
      dockerfile: PdfWorker/PdfWorker/Dockerfile
    container_name: pdf-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - orders
      - jaeger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: "Host=postgres;Port=5432;Database=pdfworker;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      RabbitMQ__VirtualHost: /
      Minio__Endpoint: http://minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: documents
      Orders__BaseUrl: http://orders:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "${PDF_WORKER_PORT}:8080"

  auth:
    build:
      context: ../Auth
      dockerfile: Auth/Dockerfile
      additional_contexts:
        shared: ../Shared
    container_name: auth
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - jaeger
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      OtelExportUri: http://jaeger:4317
    ports:
      - "${AUTH_PORT}:8080"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "${OTEL_UI_PORT}:16686" 
      - "${OTEL_GRPC_PORT}:4317" 
      - "${OTEL_HTTP_PORT}:4318" 

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    depends_on:
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT}:6333"
      - "${QDRANT_UI_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"        
      - "${MINIO_CONSOLE_PORT}:9001" 
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama

  graphrag-api:
    build:
      context: ../GraphRAG
      dockerfile: docker/Dockerfile
    container_name: graphrag-api
    restart: unless-stopped
    environment:
      SERVICE_MODE: api
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: products
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: catalog-exchange
      RABBITMQ_QUEUE: graphrag-ingestion
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${GRAPHRAG_EMBEDDING_MODEL}
      RERANKER_MODEL: ${GRAPHRAG_RERANKER_MODEL}
      GENERATION_MODEL: ${GRAPHRAG_GENERATION_MODEL}
      GENERATION_MODEL_LARGE: ${GRAPHRAG_GENERATION_MODEL_LARGE}
      OTEL_ENDPOINT: http://jaeger:4317
      SERVICE_NAME: graphrag-service
      OTEL_ENABLED: "true"
      LOG_LEVEL: ${GRAPHRAG_LOG_LEVEL}
    ports:
      - "${GRAPHRAG_API_PORT}:8100"
    depends_on:
      - qdrant
      - neo4j
      - rabbitmq
      - ollama
      - jaeger
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]

  graphrag-worker:
    build:
      context: ../GraphRAG
      dockerfile: docker/Dockerfile
    container_name: graphrag-worker
    restart: unless-stopped
    environment:
      SERVICE_MODE: worker
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: products
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: catalog-exchange
      RABBITMQ_QUEUE: graphrag-ingestion
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${GRAPHRAG_EMBEDDING_MODEL}
      RERANKER_MODEL: ${GRAPHRAG_RERANKER_MODEL}
      OTEL_ENDPOINT: http://jaeger:4317
      SERVICE_NAME: graphrag-worker
      OTEL_ENABLED: "true"
      LOG_LEVEL: ${GRAPHRAG_LOG_LEVEL}
    depends_on:
      - qdrant
      - neo4j
      - rabbitmq
      - ollama
      - jaeger
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"

  notifications-api:
    build:
      context: ../Notifications
      dockerfile: docker/Dockerfile
    container_name: notifications-api
    restart: unless-stopped
    environment:
      SERVICE_MODE: api
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/notifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_QUEUE: notifications.events
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@ecommerce.local
      SMTP_USE_TLS: "false"
      NOTIFICATIONS_OPERATOR_EMAILS: ${NOTIFICATIONS_OPERATOR_EMAILS}
      OTEL_ENDPOINT: http://jaeger:4317
      SERVICE_NAME: notifications-service
      OTEL_ENABLED: "true"
      LOG_LEVEL: ${NOTIFICATIONS_LOG_LEVEL}
    ports:
      - "${NOTIFICATIONS_API_PORT}:8200"
    depends_on:
      - postgres
      - rabbitmq
      - mailhog
      - jaeger
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]

  notifications-worker:
    build:
      context: ../Notifications
      dockerfile: docker/Dockerfile
    container_name: notifications-worker
    restart: unless-stopped
    environment:
      SERVICE_MODE: worker
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/notifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_QUEUE: notifications.events
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@ecommerce.local
      SMTP_USE_TLS: "false"
      NOTIFICATIONS_OPERATOR_EMAILS: ${NOTIFICATIONS_OPERATOR_EMAILS}
      OTEL_ENDPOINT: http://jaeger:4317
      SERVICE_NAME: notifications-worker
      OTEL_ENABLED: "true"
      LOG_LEVEL: ${NOTIFICATIONS_LOG_LEVEL}
    depends_on:
      - postgres
      - rabbitmq
      - mailhog
      - jaeger
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  ollama_data: